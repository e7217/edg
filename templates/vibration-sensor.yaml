name: vibration-sensor
resources:
  - name: velocity
    valueType: NUMBER
    unit: "mm/s"
  - name: acceleration
    valueType: NUMBER
    unit: "g"
  - name: displacement
    valueType: NUMBER
    unit: "μm"
  - name: alarm
    valueType: FLAG
constraints:
  required_relations:
    - type: partOf
      target_template: equipment
      min: 1
      max: 1

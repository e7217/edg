name: Release

# Deliberately NOT triggered by `push: tags`.
#
# release-please creates the tag with GITHUB_TOKEN, and GitHub does not start
# workflow runs from events created by that token -- the guard against a
# workflow triggering itself forever. So a tag trigger here could never fire,
# and v0.1.0 shipped as an empty release to prove it. The build is invoked
# directly by release-please.yml instead, which is itself triggered by a human
# push to main and therefore runs normally.
on:
  workflow_call:
    inputs:
      tag:
        description: Tag to build and attach artifacts to
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and attach artifacts to (e.g. v0.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            vm_suffix: linux-amd64
          - goos: linux
            goarch: arm64
            vm_suffix: linux-arm64
          - goos: darwin
            goarch: amd64
            vm_suffix: darwin-amd64
          - goos: windows
            goarch: amd64
            vm_suffix: windows-amd64
            ext: .exe

    runs-on: ubuntu-latest
    env:
      VM_VERSION: "1.133.0"
      DEPS_TAG: "deps-v1"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'

      - name: Build EDG Core
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # Explicit, because it is what the cross-compiled targets get by
          # default and the build must be identical on all four. With a cgo
          # SQLite driver this silently produced a stub binary that started
          # NATS and then died opening the database (#79).
          CGO_ENABLED: "0"
        run: |
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          go build \
            -ldflags="-s -w \
              -X main.Version=${{ inputs.tag }} \
              -X main.BuildTime=${BUILD_TIME} \
              -X main.GitCommit=${{ github.sha }}" \
            -o edg-core${{ matrix.ext }} \
            ./cmd/core

      - name: Download dependencies from own release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Download VictoriaMetrics
          if [ "${{ matrix.goos }}" = "windows" ]; then
            gh release download ${{ env.DEPS_TAG }} \
              --pattern "victoria-metrics-${{ matrix.vm_suffix }}-v${{ env.VM_VERSION }}.zip" \
              --repo ${{ github.repository }}
            unzip -q victoria-metrics-*.zip
          else
            gh release download ${{ env.DEPS_TAG }} \
              --pattern "victoria-metrics-${{ matrix.vm_suffix }}-v${{ env.VM_VERSION }}.tar.gz" \
              --repo ${{ github.repository }}
            tar -xzf victoria-metrics-*.tar.gz
          fi

      - name: Package Release
        run: |
          set -euo pipefail
          DIST_DIR="edg-${{ inputs.tag }}-${{ matrix.goos }}-${{ matrix.goarch }}"

          # Shared with scripts/install-smoke.sh, which builds a bundle the
          # same way and then installs from it in CI. Keeping one script means
          # the tested path and the shipped path cannot drift.
          scripts/build-bundle.sh "$DIST_DIR" "${{ matrix.ext }}"

          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -r "edg-${{ inputs.tag }}-${{ matrix.goos }}-${{ matrix.goarch }}.zip" "$DIST_DIR"
          else
            tar -czf "edg-${{ inputs.tag }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" "$DIST_DIR"
          fi

      - name: Upload Release Assets
        # Uploaded with gh rather than softprops/action-gh-release.
        #
        # That action derives the release from GITHUB_REF and only partly
        # honours tag_name. On a workflow that runs from a branch ref -- which
        # this one now does, because the tag trigger could never fire -- v1
        # attached to `refs/heads/main` outright, and v2 found the right
        # release and then still failed updating it, reporting
        # `Resource not accessible by integration` with Contents: write in
        # hand. gh takes the tag as an argument and infers nothing.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive=$(find . -maxdepth 1 -type f \
            -name "edg-${{ inputs.tag }}-${{ matrix.goos }}-${{ matrix.goarch }}.*" | head -1)
          if [ -z "$archive" ]; then
            echo "::error::no archive built for ${{ matrix.goos }}/${{ matrix.goarch }}"
            ls -1
            exit 1
          fi
          # --clobber so a re-dispatch replaces an asset instead of failing.
          gh release upload "${{ inputs.tag }}" "$archive" \
            --clobber --repo "${{ github.repository }}"
          echo "uploaded $(basename "$archive")"

  # The build legs can each succeed while the release still ends up with
  # nothing attached -- that is exactly how v0.1.0 shipped empty. Assert the
  # end state rather than trusting four independent uploads.
  verify:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Every platform archive is attached to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected="edg-${{ inputs.tag }}-linux-amd64.tar.gz
          edg-${{ inputs.tag }}-linux-arm64.tar.gz
          edg-${{ inputs.tag }}-darwin-amd64.tar.gz
          edg-${{ inputs.tag }}-windows-amd64.zip"

          actual=$(gh release view "${{ inputs.tag }}" --repo "${{ github.repository }}" \
            --json assets --jq '.assets[].name')
          echo "attached:"; echo "$actual" | sed 's/^/  /'

          missing=0
          while read -r want; do
            want=$(echo "$want" | xargs)
            [ -n "$want" ] || continue
            if ! echo "$actual" | grep -qx "$want"; then
              echo "::error::$want is missing from release ${{ inputs.tag }}"
              missing=1
            fi
          done <<< "$expected"
          [ $missing -eq 0 ] || exit 1
          echo "all four platform archives are attached"

      # Presence is not enough. v0.2.0 shipped three archives whose binary was
      # the cgo driver's stub: it built, it was attached, and it died at
      # startup on "requires cgo to work" (#79). Every binary is now opened and
      # checked, and the runner's own platform is executed.
      - name: Every binary is a working build, not a cgo stub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/verify && cd /tmp/verify
          gh release download "${{ inputs.tag }}" --repo "${{ github.repository }}" --clobber
          fail=0
          for archive in *.tar.gz; do
            dir="${archive%.tar.gz}"; mkdir -p "$dir"; tar xzf "$archive" -C "$dir"
          done
          for zip in *.zip; do
            dir="${zip%.zip}"; mkdir -p "$dir"; unzip -qo "$zip" -d "$dir"
          done
          while read -r bin; do
            if strings "$bin" | grep -q "requires cgo to work"; then
              echo "::error::$bin is a cgo stub: it will fail at startup opening the database"
              fail=1
            else
              echo "ok: $bin"
            fi
          done < <(find . -type f -name 'edg-core' -o -type f -name 'edg-core.exe')
          [ $fail -eq 0 ] || exit 1

          native=$(find . -path '*linux-amd64*' -name edg-core | head -1)
          chmod +x "$native"
          "$native" -version

name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        # Deliberately no `release-type:` or `package-name:` inputs.
        #
        # `package-name` is not a v4 input at all (the run logs it as an
        # unexpected input), and passing `release-type` puts the action in an
        # inline-config mode where it synthesises a config from the inputs and
        # never reads release-please-config.json. That file is where
        # `bump-minor-pre-major` lives, so ignoring it meant the first release
        # was proposed as 1.0.0 rather than 0.1.0, on the strength of breaking
        # changes made long before there was anything to break.
        #
        # With the inputs gone, v4 reads release-please-config.json (its
        # default) and that file is the single source of release behaviour.

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

  # Build the artifacts here rather than letting release.yml watch for the
  # tag. release-please creates that tag with GITHUB_TOKEN, and GitHub does
  # not start workflow runs from events created by that token, so a tag
  # trigger never fires -- v0.1.0 was published with no assets at all.
  # This job runs inside the same workflow, which a human push to main
  # triggered, so it is not subject to that guard.
  build-artifacts:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

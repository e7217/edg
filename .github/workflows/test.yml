name: Test

on:
  push:
    # The repository works on feat/, fix/, docs/, chore/ and security/ branches.
    # Restricting this list to feat/fix meant other prefixes got no CI until a
    # PR was opened.
    branches:
      - "feat/*"
      - "fix/*"
      - "docs/*"
      - "chore/*"
      - "security/*"
  pull_request:
    branches: [main]

env:
  # Single source of truth for the toolchain. Must match the `go` directive in
  # go.mod, adapters/go/sdk/go.mod and the example module — they are kept in
  # lockstep so a contributor who can build the core can also build the SDK.
  GO_VERSION: "1.24.0"
  # promtool validates the exposition format. It is a CI binary, never a
  # go.mod entry: ADR 0009 rejected client_golang precisely to keep the
  # dependency graph unchanged, and pulling Prometheus into go.mod to test the
  # encoder would undo that.
  PROMETHEUS_VERSION: "2.53.3"

jobs:
  # Job id and check name must stay "test": the repository ruleset on main
  # requires a status check with exactly that context. Renaming it would make
  # the required check never appear and block every PR.
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test ./... -v -race -coverprofile=coverage.out

      - name: Check coverage
        run: go tool cover -func=coverage.out

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: e7217/edg
          fail_ci_if_error: false

  metrics-exposition:
    name: Prometheus exposition
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install promtool
        run: |
          set -euo pipefail
          url="https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          curl -fsSL "$url" -o /tmp/prometheus.tar.gz
          tar -xzf /tmp/prometheus.tar.gz -C /tmp
          sudo install "/tmp/prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool" /usr/local/bin/promtool
          promtool --version

      - name: Check the golden exposition
        # The golden file covers the encoder's edge cases: escapes, infinities,
        # histogram cumulativeness, the "other" fold.
        run: promtool check metrics < internal/metrics/testdata/metrics_golden.txt

      - name: Check a live scrape
        # The golden file only contains fixtures, so it cannot catch a real
        # metric declared with a name promlint rejects. This starts the actual
        # binary with the production config (http.enabled: false, so the API
        # listener is not even up) and validates everything it really serves.
        run: |
          set -euo pipefail
          go build -o /tmp/edg-core ./cmd/core
          root=$(mktemp -d)
          mkdir -p "$root/data/jetstream" "$root/templates"
          sed -e "s#/var/lib/edg/data/jetstream#$root/data/jetstream#" \
              -e "s#/var/lib/edg/metadata.db#$root/metadata.db#" \
              -e "s#/var/lib/edg/data#$root/data#" \
              -e "s#/etc/edg/templates#$root/templates#" \
              -e "s#^  address: 0.0.0.0:9464#  address: 127.0.0.1:19464#" \
              deploy/configs/core/config.prod.yaml > "$root/config.yaml"

          /tmp/edg-core -config "$root/config.yaml" > "$root/core.log" 2>&1 &
          core_pid=$!
          trap 'kill $core_pid 2>/dev/null || true' EXIT

          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:19464/metrics -o "$root/metrics.txt"; then
              break
            fi
            sleep 0.5
          done
          if [ ! -s "$root/metrics.txt" ]; then
            echo "::error::/metrics never became reachable"
            cat "$root/core.log"
            exit 1
          fi

          promtool check metrics < "$root/metrics.txt"
          echo "families=$(grep -c '^# HELP' "$root/metrics.txt") series=$(grep -vc '^#' "$root/metrics.txt")"

      - name: Assert internal/metrics is stdlib-only
        # ADR 0009's central claim, and the reason the encoder is hand-written
        # at all. A third-party import here means the ADR needs amending, not
        # that this check needs relaxing.
        run: |
          set -euo pipefail
          # A stdlib import path has no dot in its first segment; the
          # package's own module path is excluded.
          module=$(go list -m)
          external=$(go list -deps ./internal/metrics \
            | grep -v "^${module}\(/\|$\)" \
            | awk -F/ '$1 ~ /\./')
          if [ -n "$external" ]; then
            echo "::error::internal/metrics imports non-stdlib packages:"
            echo "$external"
            exit 1
          fi

  go-sdk:
    # adapters/go/sdk is a separate module and the repository has no go.work,
    # so the core job's `go test ./...` never reaches it. Without this job its
    # tests are dead weight.
    name: Go SDK module
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Vet
        working-directory: adapters/go/sdk
        run: go vet ./...

      - name: Run tests
        working-directory: adapters/go/sdk
        run: go test ./... -v -race

      - name: Build reference adapter example
        # Its own module with a replace directive to ../..; an SDK API change
        # breaks it independently of the SDK's own tests.
        working-directory: adapters/go/sdk/examples/modbus_tcp_sensor
        run: |
          go build ./...
          go test ./... -race

  go-version-lockstep:
    name: Go version lockstep
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Assert every module declares the CI toolchain version
        run: |
          fail=0
          for mod in go.mod adapters/go/sdk/go.mod adapters/go/sdk/examples/modbus_tcp_sensor/go.mod; do
            declared=$(awk '/^go /{print $2; exit}' "$mod")
            if [ "$declared" != "${GO_VERSION}" ]; then
              echo "::error file=$mod::go directive is $declared, expected ${GO_VERSION} (see .github/workflows/test.yml env.GO_VERSION)"
              fail=1
            fi
          done
          # release.yml builds the shipped binary; a lower toolchain there than
          # go.mod requires is a build that cannot succeed.
          release_go=$(awk -F"'" '/go-version:/{print $2; exit}' .github/workflows/release.yml)
          if [ "$release_go" != "${GO_VERSION}" ]; then
            echo "::error file=.github/workflows/release.yml::go-version is $release_go, expected ${GO_VERSION}"
            fail=1
          fi
          exit $fail

  python-sdk:
    name: Python SDK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        working-directory: adapters/python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,examples]"

      - name: Run tests
        working-directory: adapters/python
        run: pytest -v

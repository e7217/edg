<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EDG Master Data</title>
<style>
  :root { --bg:#0f1115; --panel:#1a1e26; --line:#2a2f3a; --fg:#e6e9ef; --muted:#9aa4b2; --accent:#4f8cff; --danger:#ff5c5c; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  header { display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding:12px 16px; background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; }
  header h1 { font-size:16px; margin:0 12px 0 0; }
  header input { background:#0c0e12; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 8px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:6px 12px; cursor:pointer; }
  button.secondary { background:#2a2f3a; }
  button.danger { background:transparent; color:var(--danger); border:1px solid var(--danger); padding:2px 8px; }
  main { padding:16px; display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(360px,1fr)); }
  section { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  section h2 { font-size:14px; margin:0 0 10px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; }
  form { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  form input,form select { background:#0c0e12; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 8px; }
  .muted { color:var(--muted); }
  .pill { display:inline-block; padding:1px 8px; border-radius:999px; background:#23314f; color:#bcd0ff; font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>EDG Master Data</h1>
  <input id="token" type="password" placeholder="bearer token (for writes)" size="28" />
  <button id="refresh" class="secondary">Refresh</button>
  <span id="status" class="muted"></span>
</header>
<main>
  <section>
    <h2>Assets</h2>
    <form id="asset-form">
      <input name="name" placeholder="name" required />
      <input name="template_name" placeholder="template (optional)" />
      <button type="submit">Create</button>
    </form>
    <table><thead><tr><th>ID</th><th>Name</th><th>Template</th><th></th></tr></thead><tbody id="assets"></tbody></table>
  </section>
  <section>
    <h2>Relations</h2>
    <form id="relation-form">
      <input name="source_asset_id" placeholder="source id" required />
      <input name="target_asset_id" placeholder="target id" required />
      <select name="relation_type"><option>partOf</option><option>connectedTo</option><option>locatedIn</option></select>
      <button type="submit">Create</button>
    </form>
    <table><thead><tr><th>Source</th><th>Type</th><th>Target</th><th></th></tr></thead><tbody id="relations"></tbody></table>
  </section>
  <section>
    <h2>Templates</h2>
    <table><thead><tr><th>Name</th><th>Resources</th><th>Constraints</th></tr></thead><tbody id="templates"></tbody></table>
  </section>
  <section>
    <h2>Points</h2>
    <form id="point-search">
      <input name="name" placeholder="search tag name across all assets" />
      <button type="submit">Search</button>
      <button type="button" id="point-clear">Show lists</button>
    </form>
    <table><thead><tr id="points-head"></tr></thead><tbody id="points"></tbody></table>
  </section>
  <section>
    <h2>Adapters</h2>
    <table><thead><tr><th>Adapter</th><th>Assets</th><th>Availability</th><th>Run</th><th>Device</th><th>Rate</th><th>Last HB</th><th>Version</th></tr></thead><tbody id="adapters"></tbody></table>
  </section>
  <section>
    <h2>Adapter Drift</h2>
    <table><thead><tr><th>Kind</th><th>Subject</th><th>Detail</th></tr></thead><tbody id="drift"></tbody></table>
  </section>
  <section>
    <h2>Constraint Violations</h2>
    <table><thead><tr><th>Asset</th><th>Type</th><th>Message</th></tr></thead><tbody id="violations"></tbody></table>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const token = () => $("token").value.trim();
$("token").value = localStorage.getItem("edg_token") || "";
$("token").addEventListener("change", () => localStorage.setItem("edg_token", token()));

function setStatus(msg, isErr) { const s = $("status"); s.textContent = msg; s.style.color = isErr ? "#ff5c5c" : ""; }

async function api(method, path, body) {
  const headers = {};
  if (body) headers["Content-Type"] = "application/json";
  if (method !== "GET" && token()) headers["Authorization"] = "Bearer " + token();
  const res = await fetch("/api/v1" + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  const json = await res.json().catch(() => ({}));
  if (!res.ok || json.success === false) throw new Error(json.error || ("HTTP " + res.status));
  return json.data;
}

function cell(text) { const td = document.createElement("td"); td.textContent = text == null ? "" : String(text); return td; }
function delBtn(onClick) {
  const td = document.createElement("td");
  const b = document.createElement("button"); b.className = "danger"; b.textContent = "delete";
  b.onclick = onClick; td.appendChild(b); return td;
}

async function loadAssets() {
  const assets = (await api("GET", "/assets?limit=500")) || [];
  const tb = $("assets"); tb.innerHTML = "";
  for (const a of assets) {
    const tr = document.createElement("tr");
    tr.append(cell(a.id), cell(a.name), cell(a.template_name || ""),
      delBtn(() => mutate(() => api("DELETE", "/assets/" + encodeURIComponent(a.id)))));
    tb.appendChild(tr);
  }
}
async function loadRelations() {
  const rels = (await api("GET", "/relations")) || [];
  const tb = $("relations"); tb.innerHTML = "";
  for (const r of rels) {
    const tr = document.createElement("tr");
    tr.append(cell(r.source_asset_id), cell(r.relation_type), cell(r.target_asset_id),
      delBtn(() => mutate(() => api("DELETE", "/relations/" + encodeURIComponent(r.id)))));
    tb.appendChild(tr);
  }
}
async function loadTemplates() {
  const tmpls = (await api("GET", "/templates")) || [];
  const tb = $("templates"); tb.innerHTML = "";
  for (const t of tmpls) {
    const rc = (t.constraints && t.constraints.required_relations || []).length;
    const fc = (t.constraints && t.constraints.forbidden_relations || []).length;
    const tr = document.createElement("tr");
    tr.append(cell(t.name), cell((t.resources || []).map(r => r.name).join(", ")), cell(`req ${rc} / forbid ${fc}`));
    tb.appendChild(tr);
  }
}
// Points has two modes in one table: the per-asset lists, and a flat search
// across every asset. Search is the question an operator actually asks of a
// plant-wide tag inventory -- "which boxes call this something else" -- so it
// gets a first-class place rather than a filter on a paginated list.
let pointQuery = "";

function setHead(cols) {
  const tr = $("points-head"); tr.innerHTML = "";
  for (const c of cols) { const th = document.createElement("th"); th.textContent = c; tr.appendChild(th); }
}

async function loadPoints() {
  const tb = $("points"); tb.innerHTML = "";
  if (pointQuery) {
    setHead(["Asset", "Protocol", "Point", "Type", "Unit", "Address", "Enabled"]);
    const hits = (await api("GET", "/points?name=" + encodeURIComponent(pointQuery))) || [];
    for (const h of hits) {
      const tr = document.createElement("tr");
      tr.append(cell(h.asset_id), cell(h.protocol), cell(h.name), cell(h.value_type),
        cell(h.unit || ""), cell(h.address), cell(h.enabled ? "yes" : "no"));
      tb.appendChild(tr);
    }
    if (hits.length === 0) tb.appendChild(emptyRow(7, "no point matches " + pointQuery));
    return;
  }

  setHead(["Asset", "Protocol", "Points", "Poll", "Version", ""]);
  const lists = (await api("GET", "/points")) || [];
  for (const l of lists) {
    const enabled = (l.points || []).filter(p => p.enabled).length;
    const total = (l.points || []).length;
    const tr = document.createElement("tr");
    tr.append(cell(l.asset_id), cell(l.protocol),
      // Disabled declarations are kept for the record, so show both numbers
      // rather than a count that hides them.
      cell(enabled === total ? String(total) : enabled + " of " + total + " enabled"),
      cell(l.poll_interval_ms ? l.poll_interval_ms + " ms" : "adapter default"),
      cell(l.version),
      delBtn(() => mutate(() => api("DELETE", "/assets/" + encodeURIComponent(l.asset_id) + "/points"))));
    tb.appendChild(tr);
  }
  if (lists.length === 0) {
    tb.appendChild(emptyRow(6, "no point lists declared — import with edg-core -import-points DIR"));
  }
}

function emptyRow(span, text) {
  const tr = document.createElement("tr");
  const td = document.createElement("td");
  td.colSpan = span; td.textContent = text; td.style.color = "#888";
  tr.appendChild(td); return tr;
}

async function loadViolations() {
  const report = await api("GET", "/constraints");
  const tb = $("violations"); tb.innerHTML = "";
  for (const v of (report && report.violations) || []) {
    const tr = document.createElement("tr");
    tr.append(cell(v.asset_name || v.asset_id), cell(v.constraint_type), cell(v.message));
    tb.appendChild(tr);
  }
}

async function loadAdapters() {
  const tb = $("adapters"); tb.innerHTML = "";
  let snap;
  try {
    snap = await api("GET", "/adapters");
  } catch (e) {
    // adapters.enabled=false returns 404; that is "not tracked here", not an error.
    tb.appendChild(rowMessage(8, "adapter tracking is disabled"));
    return;
  }
  const list = (snap && snap.adapters) || [];
  if (!list.length) {
    tb.appendChild(rowMessage(8, snap && snap.warming
      ? "waiting for the first heartbeats…"   // right after a core restart an empty list proves nothing
      : "no adapters have reported"));
    return;
  }
  for (const a of list) {
    const tr = document.createElement("tr");
    const pill = document.createElement("span");
    pill.className = "pill";
    pill.textContent = a.availability;
    const avail = document.createElement("td");
    avail.appendChild(pill);
    tr.append(
      cell(a.adapter_id),
      cell((a.asset_ids || []).join(", ")),
      avail,
      cell(a.run_state || ""),
      cell(a.device_state || ""),
      cell(a.observed_publish_hz ? a.observed_publish_hz.toFixed(2) + "/s" : ""),
      cell(heartbeatAge(a)),
      cell(a.adapter_version || a.sdk || ""),
    );
    tb.appendChild(tr);
  }
}

// heartbeatAge renders elapsed time as a fraction of the adapter's own declared
// interval rather than absolute seconds: the browser's clock is unrelated to
// the core's, so an absolute age would be wrong by whatever the two disagree by.
function heartbeatAge(a) {
  if (!a.last_seen_at || !a.heartbeat_interval_s) return "";
  const elapsed = (Date.now() - Date.parse(a.last_seen_at)) / 1000;
  const ratio = elapsed / a.heartbeat_interval_s;
  if (!isFinite(ratio) || ratio < 0) return "";
  return ratio.toFixed(1) + "x interval";
}

async function loadDrift() {
  const tb = $("drift"); tb.innerHTML = "";
  let report;
  try {
    report = await api("GET", "/adapters/drift");
  } catch (e) {
    tb.appendChild(rowMessage(3, "adapter tracking is disabled"));
    return;
  }
  const issues = (report && report.issues) || [];
  if (!issues.length) {
    tb.appendChild(rowMessage(3, "no drift detected"));
    return;
  }
  for (const i of issues) {
    const tr = document.createElement("tr");
    tr.append(cell(i.kind), cell(i.subject), cell(i.detail));
    tb.appendChild(tr);
  }
}

function rowMessage(span, text) {
  const tr = document.createElement("tr");
  const td = document.createElement("td");
  td.colSpan = span;
  td.textContent = text;
  td.style.opacity = "0.6";
  tr.appendChild(td);
  return tr;
}

async function refresh() {
  setStatus("loading…");
  try {
    await Promise.all([loadAssets(), loadRelations(), loadTemplates(), loadPoints(), loadViolations(), loadAdapters(), loadDrift()]);
    setStatus("updated " + new Date().toLocaleTimeString());
  } catch (e) { setStatus(e.message, true); }
}
async function mutate(fn) {
  try { await fn(); await refresh(); } catch (e) { setStatus(e.message, true); alert(e.message); }
}

$("refresh").onclick = refresh;
$("asset-form").onsubmit = (e) => {
  e.preventDefault();
  const f = e.target;
  mutate(() => api("POST", "/assets", { name: f.name.value, template_name: f.template_name.value || undefined }))
    .then(() => f.reset());
};
$("relation-form").onsubmit = (e) => {
  e.preventDefault();
  const f = e.target;
  mutate(() => api("POST", "/relations", {
    source_asset_id: f.source_asset_id.value, target_asset_id: f.target_asset_id.value, relation_type: f.relation_type.value,
  })).then(() => f.reset());
};
$("point-search").onsubmit = (e) => {
  e.preventDefault();
  pointQuery = e.target.name.value.trim();
  loadPoints().catch((err) => setStatus(err.message, true));
};
$("point-clear").onclick = () => {
  pointQuery = "";
  $("point-search").reset();
  loadPoints().catch((err) => setStatus(err.message, true));
};
refresh();
</script>
</body>
</html>

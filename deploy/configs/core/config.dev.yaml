# EDG Core Development Configuration

nats:
  port: 4222
  http_port: 8222
  store_dir: ./data/jetstream
  log_level: debug

storage:
  metadata_db: ./data/metadata.db
  data_dir: ./data
  migrations_dir: embedded
  auto_migrate: true

templates:
  dir: ./templates
  auto_reload: true

asset_registration:
  # auto creates Asset records for unknown asset_id values.
  # manual keeps validated data flowing without creating Asset records.
  mode: auto

jetstream:
  validated_subject: platform.data.validated
  dead_letter_subject: platform.data.deadletter
  stream:
    name: PLATFORM_DATA
    subjects:
      - platform.data.>
    storage: file
    max_age: 168h
    max_bytes: 1073741824
    replicas: 1
    retention: limits
    discard: old

logging:
  level: debug
  format: text

# EDG Core Development Configuration

nats:
  # dev binds the client port on all interfaces so containers on the compose
  # network can reach it; authorization still applies (ADR 0007).
  host: 0.0.0.0
  port: 4222
  # The monitoring port has no authentication mechanism (/varz, /connz,
  # /debug/vars). Keep it on loopback.
  http_host: 127.0.0.1
  http_port: 8222
  auth:
    mode: compat   # compat | strict | off
    # Empty -> <storage.data_dir>/nats-credentials.json (mode 0600).
    # EDG_NATS_CREDENTIALS_FILE overrides this.
    credentials_file: ""
  store_dir: ./data/jetstream
  log_level: debug

storage:
  metadata_db: ./data/metadata.db
  data_dir: ./data
  migrations_dir: embedded
  auto_migrate: true

templates:
  dir: ./templates

# Behavior for data whose asset_id has no declared master-data record.
# pass_through: publish un-enriched to validated (default).
# dead_letter: route to the dead-letter subject instead.
unknown_asset_policy: pass_through

alarm:
  window_seconds: 5
  max_traversal_depth: 10

constraints:
  enforcement: warn

http:
  enabled: true
  address: 127.0.0.1:8080
  token_env: EDG_HTTP_TOKEN
  webui_enabled: true
  cors_allowed_origins:
    - http://localhost:3000

jetstream:
  validated_subject: platform.data.validated
  dead_letter_subject: platform.data.deadletter
  stream:
    name: PLATFORM_DATA
    subjects:
      - platform.data.>
    storage: file
    max_age: 168h
    max_bytes: 1073741824
    replicas: 1
    retention: limits
    discard: old

# Built-in VictoriaMetrics sink (replaces the external Telegraf bridge).
# A durable JetStream consumer writes validated data to VictoriaMetrics.
# Override `url` per environment with the EDG_SINK_URL env var if needed.
sink:
  enabled: true
  url: http://localhost:8428
  consumer_name: edg-core-vm-sink
  measurement: edg_data
  batch_max_size: 500
  flush_interval: 1s
  request_timeout: 5s

logging:
  level: debug
  format: text

# Adapter runtime status (ADR 0008). Runtime state is in memory only; core
# re-learns it after a restart by broadcasting platform.adapter.hello.
adapters:
  enabled: true
  stale_after_floor: 5s
  probe_on_miss: true

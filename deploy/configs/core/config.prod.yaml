# EDG Core Production Configuration

nats:
  port: 4222
  http_port: 8222
  log_level: warn

storage:
  metadata_db: /var/lib/edg/metadata.db
  data_dir: /var/lib/edg/data
  migrations_dir: embedded
  auto_migrate: true

templates:
  dir: /etc/edg/templates
  auto_reload: false

logging:
  level: warn
  format: json

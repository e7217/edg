# EDG Core Staging Configuration

nats:
  port: 4222
  http_port: 8222
  store_dir: /var/lib/edg/data/jetstream
  log_level: info

storage:
  metadata_db: /var/lib/edg/metadata.db
  data_dir: /var/lib/edg/data
  migrations_dir: embedded
  auto_migrate: true

templates:
  dir: /etc/edg/templates

alarm:
  window_seconds: 5
  max_traversal_depth: 10

constraints:
  enforcement: warn

http:
  enabled: false
  address: 127.0.0.1:8080
  token_env: EDG_HTTP_TOKEN

jetstream:
  validated_subject: platform.data.validated
  dead_letter_subject: platform.data.deadletter
  stream:
    name: PLATFORM_DATA
    subjects:
      - platform.data.>
    storage: file
    max_age: 168h
    max_bytes: 1073741824
    replicas: 1
    retention: limits
    discard: old

# Built-in VictoriaMetrics sink. Override `url` with EDG_SINK_URL when
# VictoriaMetrics runs on a different host (e.g. a container service name).
sink:
  enabled: true
  url: http://localhost:8428
  consumer_name: edg-core-vm-sink
  measurement: edg_data
  batch_max_size: 500
  flush_interval: 1s
  request_timeout: 5s

logging:
  level: info
  format: json

# EDG Core Staging Configuration

nats:
  port: 4222
  http_port: 8222
  store_dir: /var/lib/edg/data/jetstream
  log_level: info

storage:
  metadata_db: /var/lib/edg/metadata.db
  data_dir: /var/lib/edg/data
  migrations_dir: embedded
  auto_migrate: true

templates:
  dir: /etc/edg/templates
  auto_reload: true

alarm:
  window_seconds: 5
  max_traversal_depth: 10

jetstream:
  validated_subject: platform.data.validated
  dead_letter_subject: platform.data.deadletter
  stream:
    name: PLATFORM_DATA
    subjects:
      - platform.data.>
    storage: file
    max_age: 168h
    max_bytes: 1073741824
    replicas: 1
    retention: limits
    discard: old

logging:
  level: info
  format: json

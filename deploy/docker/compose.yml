# version: '3.8'

services:
  # VictoriaMetrics - Time series database
  edg-victoriametrics:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.victoriametrics
    image: edg-victoriametrics:${VERSION:-latest}
    container_name: edg-victoriametrics
    restart: unless-stopped
    ports:
      - "8428:8428"
    volumes:
      - vm-data:/victoria-metrics-data
    command:
      - "-storageDataPath=/victoria-metrics-data"
      - "-retentionPeriod=1y"
      - "-httpListenAddr=:8428"
    networks:
      - service-net
    healthcheck:
      disable: true

  # EDG Core - Main application
  edg-core:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.core
    image: edg-core:${VERSION:-latest}
    container_name: edg-core
    restart: unless-stopped
    ports:
      - "4222:4222"  # NATS
      - "8222:8222"  # NATS monitoring
    volumes:
      - edg-data:/opt/edg/data
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ENV=${ENV:-dev}
      # Built-in VM sink writes validated data straight to VictoriaMetrics.
      - EDG_SINK_URL=http://edg-victoriametrics:8428
    depends_on:
      - edg-victoriametrics
    networks:
      - service-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8222/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Grafana - optional dashboards. Opt in with `--profile grafana`.
  # Day-to-day inspection is available without it via VictoriaMetrics' built-in
  # vmui at http://localhost:8428/vmui.
  edg-grafana:
    profiles: ["grafana"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.grafana
    image: edg-grafana:${VERSION:-latest}
    container_name: edg-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - edg-victoriametrics
    networks:
      - service-net

volumes:
  vm-data:
    driver: local
  edg-data:
    driver: local
  grafana-data:
    driver: local

networks:
  service-net:      
    external: true

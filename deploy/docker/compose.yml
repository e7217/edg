# version: '3.8'

services:
  # VictoriaMetrics - Time series database
  edg-victoriametrics:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.victoriametrics
    image: edg-victoriametrics:${VERSION:-latest}
    container_name: edg-victoriametrics
    restart: unless-stopped
    ports:
      - "8428:8428"
    volumes:
      - vm-data:/victoria-metrics-data
    command:
      - "-storageDataPath=/victoria-metrics-data"
      - "-retentionPeriod=1y"
      - "-httpListenAddr=:8428"
      # Built-in Prometheus-compatible scraper (ADR 0009). It pulls edg-core's
      # operational metrics; the plant's telemetry still arrives over the
      # sink's write path.
      - "-promscrape.config=/etc/vm/scrape.yml"
      - "-promscrape.configCheckInterval=30s"
    networks:
      - service-net
    healthcheck:
      disable: true

  # EDG Core - Main application
  edg-core:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.core
      args:
        # Selects which deploy/configs/core/config.<ENV>.yaml the image links
        # to /opt/edg/config.yaml. It is a BUILD arg because the symlink is
        # made at build time; passing it only at runtime looked like it
        # selected the config and selected nothing (#114). Rebuild to change
        # it: `ENV=dev docker compose build edg-core`.
        ENV: ${ENV:-prod}
    image: edg-core:${VERSION:-latest}
    container_name: edg-core
    restart: unless-stopped
    ports:
      - "4222:4222"  # NATS (authorization applies; see ADR 0007)
      # NATS monitoring (8222) is deliberately not published: it exposes
      # /varz, /connz and /debug/vars with no authentication of any kind, and
      # the container healthcheck below reaches it over loopback anyway.
      # Metrics (9464) is likewise not published: VictoriaMetrics scrapes it
      # over the compose network, and /metrics has no authentication either.
    volumes:
      # storage.data_dir in the shipped configs. A volume mounted anywhere else
      # leaves the process writing to the container filesystem, or unable to
      # write at all (#114).
      - edg-data:/opt/edg/data
    environment:
      # LOG_LEVEL and ENV used to be passed here and were read by nothing; log
      # level comes from logging.level in the config file, and ENV is a build
      # arg above.
      #
      # Built-in VM sink writes validated data straight to VictoriaMetrics.
      - EDG_SINK_URL=http://edg-victoriametrics:8428
      # Role credentials default to <storage.data_dir>/nats-credentials.json,
      # which is on the volume above, so they survive recreation. Read them:
      #   docker compose exec edg-core cat /opt/edg/data/nats-credentials.json
    depends_on:
      - edg-victoriametrics
    networks:
      - service-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8222/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Grafana - optional dashboards. Opt in with `--profile grafana`.
  # Day-to-day inspection is available without it via VictoriaMetrics' built-in
  # vmui at http://localhost:8428/vmui.
  edg-grafana:
    profiles: ["grafana"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.grafana
    image: edg-grafana:${VERSION:-latest}
    container_name: edg-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - edg-victoriametrics
    networks:
      - service-net

volumes:
  vm-data:
    driver: local
  edg-data:
    driver: local
  grafana-data:
    driver: local

networks:
  service-net:
    # Compose creates and owns this network. It was declared `external: true`,
    # which requires `docker network create service-net` out of band -- and
    # that step is documented nowhere, so `docker compose up` failed outright
    # on any machine that did not already happen to have one lying around
    # (#114). `name:` pins it without the project prefix so an adapter
    # container started separately can still join with
    # `--network service-net`.
    name: service-net

[project]
name = "edg-sdk"
version = "0.1.0"
description = "Python SDK for EDG Platform - Adapter Development"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nats-py>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pyyaml>=6.0",
]
examples = [
    "pymodbus>=3.7,<4.0",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
# Without asyncio_mode every async test needs its own @pytest.mark.asyncio and a
# missing marker silently skips the test body instead of failing.
asyncio_mode = "auto"
testpaths = ["sdk/tests", "examples"]
addopts = "-ra"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sdk"]
